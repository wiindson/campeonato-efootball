<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef1f7" />
  <meta name="description" content="Crie ou participe de um campeonato online de eFootball." />
  <title>Nosso Campeonato · Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell app-shell--online">
    <header class="hero soft-card online-hero">
      <div class="hero__identity">
        <div class="hero__eyebrow"><span class="hero__mark" aria-hidden="true"></span><span>Nosso Campeonato · Online</span></div>
        <h1>Jogue junto,<br /><span>de qualquer lugar</span></h1>
        <p>Crie uma sala, convide seus amigos e acompanhe a tabela em tempo real.</p>
      </div>
      <div class="hero__summary">
        <div class="hero__actions">
          <span class="btn btn--secondary btn--compact btn--disabled" aria-disabled="true" title="O modo local está temporariamente desativado">Modo local desativado</span>
          <span id="onlineStatus" class="status-badge">Conectando</span>
        </div>
      </div>
    </header>

    <main id="onlineApp" aria-live="polite">
      <section class="soft-card section-card"><div class="empty-state">Preparando sua identidade segura…</div></section>
    </main>

    <footer>Crie · Convide · Jogue · Seja campeão</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script type="module" src="./online.js"></script>
</body>
</html>
